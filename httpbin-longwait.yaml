apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin-longwait
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-longwait
  labels:
    app: httpbin-longwait
    service: httpbin-longwait
spec:
  ports:
  - name: http
    port: 8000
    targetPort: 80
  selector:
    app: httpbin-longwait
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-longwait
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin-longwait
      version: v1
  template:
    metadata:
      labels:
        app: httpbin-longwait
        version: v1
    spec:
      serviceAccountName: httpbin-longwait
      containers:
      - image: httpbinarm64:latest
        imagePullPolicy: IfNotPresent
        name: httpbin-longwait
        args:
        - /bin/bash
        - -c
        - sleep 60; touch /tmp/healthy; gunicorn -b 0.0.0.0:80 httpbin:app -k gevent;
        ports:
        - containerPort: 80
        readinessProbe:
          exec:
            command:
            - cat
            - /tmp/healthy
          initialDelaySeconds: 5
          periodSeconds: 5